<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#111111"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e31b23"/>
      <stop offset="100%" style="stop-color:#ff2d36"/>
    </linearGradient>
    <linearGradient id="redV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d36"/>
      <stop offset="100%" style="stop-color:#b8151b"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e31b23;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e31b23;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="roundCard">
      <rect width="1000" height="180" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- Subtle geometric decorations -->
  <polygon points="0,0 200,0 0,200" fill="#e31b23" opacity="0.04"/>
  <polygon points="1080,1350 880,1350 1080,1150" fill="#e31b23" opacity="0.04"/>
  <line x1="0" y1="0" x2="1080" y2="1350" stroke="#2a2a2a" stroke-width="0.5" opacity="0.15"/>
  <line x1="1080" y1="0" x2="0" y2="1350" stroke="#2a2a2a" stroke-width="0.5" opacity="0.15"/>

  <!-- Corner accents -->
  <line x1="40" y1="40" x2="40" y2="90" stroke="#e31b23" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="40" x2="90" y2="40" stroke="#e31b23" stroke-width="2" opacity="0.5"/>
  <line x1="1040" y1="1310" x2="1040" y2="1260" stroke="#e31b23" stroke-width="2" opacity="0.5"/>
  <line x1="1040" y1="1310" x2="990" y2="1310" stroke="#e31b23" stroke-width="2" opacity="0.5"/>

  <!-- Logo + Brand top-left -->
  <image href="/logo.png" x="50" y="50" width="44" height="44" />
  <text x="104" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Extreme<tspan fill="#e31b23">Dev</tspan>
  </text>

  <!-- ===== TOP: THE CONFUSION ===== -->

  <!-- Red glow behind confused area -->
  <ellipse cx="540" cy="280" rx="350" ry="250" fill="url(#redGlow)"/>

  <!-- Floating messy words around the person - scattered, chaotic -->
  <g opacity="0.12" font-family="Inter, Segoe UI, sans-serif" font-weight="800" fill="#e31b23">
    <text x="120" y="130" font-size="48" transform="rotate(-12, 120, 130)">Uber</text>
    <text x="750" y="100" font-size="38" transform="rotate(8, 750, 100)">IA</text>
    <text x="800" y="210" font-size="28" transform="rotate(-5, 800, 210)">cloud</text>
    <text x="100" y="250" font-size="32" transform="rotate(6, 100, 250)">app</text>
    <text x="820" y="340" font-size="26" transform="rotate(-8, 820, 340)">backend</text>
    <text x="140" y="380" font-size="24" transform="rotate(10, 140, 380)">MVP</text>
    <text x="780" y="440" font-size="30" transform="rotate(-4, 780, 440)">API</text>
    <text x="100" y="460" font-size="22" transform="rotate(7, 100, 460)">database</text>
  </g>

  <!-- Confused person — larger, central -->
  <g transform="translate(540, 290)">
    <!-- Head -->
    <circle cx="0" cy="-65" r="52" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <!-- Eyes — confused -->
    <g opacity="0.8">
      <line x1="-20" y1="-78" x2="-10" y2="-68" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="-10" y1="-78" x2="-20" y2="-68" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="10" y1="-78" x2="20" y2="-68" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="20" y1="-78" x2="10" y2="-68" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Mouth — wavy confused -->
    <path d="M-16,-42 Q-8,-36 0,-44 Q8,-36 16,-42" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Body -->
    <line x1="0" y1="-10" x2="0" y2="65" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Arms — raised in confusion -->
    <line x1="0" y1="15" x2="-55" y2="-20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="0" y1="15" x2="55" y2="-20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- Hands open -->
    <line x1="-55" y1="-20" x2="-62" y2="-30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="-55" y1="-20" x2="-65" y2="-18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="55" y1="-20" x2="62" y2="-30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="55" y1="-20" x2="65" y2="-18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Legs -->
    <line x1="0" y1="65" x2="-25" y2="110" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="0" y1="65" x2="25" y2="110" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <!-- Floating question marks -->
    <text x="-100" y="-90" font-family="Inter, sans-serif" font-size="50" font-weight="900" fill="#e31b23" opacity="0.8">?</text>
    <text x="80" y="-100" font-family="Inter, sans-serif" font-size="40" font-weight="900" fill="#e31b23" opacity="0.6">?</text>
    <text x="-120" y="-20" font-family="Inter, sans-serif" font-size="34" font-weight="900" fill="#e31b23" opacity="0.5">?</text>
    <text x="110" y="-30" font-family="Inter, sans-serif" font-size="60" font-weight="900" fill="#e31b23" opacity="0.7">?</text>
    <text x="90" y="50" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#e31b23" opacity="0.4">?</text>
    <text x="-110" y="70" font-family="Inter, sans-serif" font-size="36" font-weight="900" fill="#e31b23" opacity="0.45">?</text>
  </g>

  <!-- Thought bubble -->
  <g transform="translate(730, 140)">
    <rect x="-120" y="-40" width="240" height="70" rx="35" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1.5"/>
    <text x="0" y="-5" font-family="Inter, sans-serif" font-size="16" fill="#888888" text-anchor="middle" font-weight="600">
      <tspan fill="#e31b23">"</tspan>Quiero una app tipo Uber<tspan fill="#e31b23">"</tspan>
    </text>
    <!-- Bubble tail dots -->
    <circle cx="-90" cy="45" r="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="-70" cy="62" r="5" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  </g>

  <!-- Main headline -->
  <text x="540" y="490" font-family="Inter, Segoe UI, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    No es tu culpa.
  </text>
  <text x="540" y="535" font-family="Inter, Segoe UI, sans-serif" font-size="20" fill="#888888" text-anchor="middle">
    Necesitas ayuda para entender tu problema.
  </text>

  <!-- ===== TRANSITION ARROW ===== -->
  <g transform="translate(540, 610)">
    <!-- Long vertical line -->
    <line x1="0" y1="-20" x2="0" y2="30" stroke="#e31b23" stroke-width="2" opacity="0.4"/>
    <!-- Circle with arrow -->
    <circle cx="0" cy="50" r="24" fill="#e31b23"/>
    <polygon points="-9,42 9,42 0,58" fill="#ffffff"/>
  </g>

  <!-- ===== BOTTOM: THE SOLUTION FLOW ===== -->

  <!-- Green glow behind solution -->
  <ellipse cx="540" cy="950" rx="400" ry="250" fill="url(#greenGlow)"/>

  <!-- Solution title -->
  <text x="540" y="720" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Nuestro flujo para llegar a <tspan fill="#e31b23">tu solución</tspan>
  </text>

  <!-- ===== 5-STEP VISUAL FLOW — Large circular icons ===== -->

  <!-- Step 1: Empatizar -->
  <g transform="translate(540, 820)">
    <circle cx="0" cy="0" r="50" fill="#1a1a1a" stroke="#e31b23" stroke-width="2"/>
    <!-- Heart icon -->
    <path d="M0,15 C0,15 -22,-10 -22,-20 C-22,-30 -12,-35 0,-22 C12,-35 22,-30 22,-20 C22,-10 0,15 0,15Z" fill="#e31b23" opacity="0.9"/>
    <text x="0" y="75" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Empatizar</text>
  </g>

  <!-- Curved arrow 1→2 -->
  <g transform="translate(540, 820)">
    <path d="M55,10 Q120,40 160,100" fill="none" stroke="#e31b23" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
    <polygon points="158,96 165,105 155,105" fill="#e31b23" opacity="0.4"/>
  </g>

  <!-- Step 2: Idear -->
  <g transform="translate(720, 930)">
    <circle cx="0" cy="0" r="50" fill="#1a1a1a" stroke="#e31b23" stroke-width="2"/>
    <!-- Lightbulb icon -->
    <path d="M0,-22 C-16,-22 -18,-4 -12,8 L12,8 C18,-4 16,-22 0,-22Z" fill="none" stroke="#e31b23" stroke-width="2.5"/>
    <rect x="-8" y="8" width="16" height="8" rx="2" fill="none" stroke="#e31b23" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="-4" stroke="#e31b23" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="75" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Idear</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(720, 930)">
    <path d="M-20,55 Q-80,100 -160,100" fill="none" stroke="#e31b23" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
    <polygon points="-156,96 -165,100 -156,104" fill="#e31b23" opacity="0.4"/>
  </g>

  <!-- Step 3: Prototipar -->
  <g transform="translate(540, 1040)">
    <circle cx="0" cy="0" r="50" fill="#1a1a1a" stroke="#e31b23" stroke-width="2"/>
    <!-- Layers/screens icon -->
    <rect x="-18" y="-18" width="26" height="20" rx="3" fill="none" stroke="#e31b23" stroke-width="2.5"/>
    <rect x="-10" y="-10" width="26" height="20" rx="3" fill="none" stroke="#e31b23" stroke-width="1.8" opacity="0.6"/>
    <rect x="-2" y="-2" width="26" height="20" rx="3" fill="none" stroke="#e31b23" stroke-width="1.2" opacity="0.35"/>
    <text x="0" y="75" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Prototipar</text>
  </g>

  <!-- Arrow 3→4 -->
  <g transform="translate(540, 1040)">
    <path d="M-55,10 Q-120,40 -160,100" fill="none" stroke="#e31b23" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
    <polygon points="-158,96 -165,105 -155,105" fill="#e31b23" opacity="0.4"/>
  </g>

  <!-- Step 4: Probar -->
  <g transform="translate(360, 1150)">
    <circle cx="0" cy="0" r="50" fill="#1a1a1a" stroke="#e31b23" stroke-width="2"/>
    <!-- Checkmark icon -->
    <polyline points="-16,0 -6,12 18,-14" fill="none" stroke="#e31b23" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="75" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Probar</text>
  </g>

  <!-- Arrow 4→5 -->
  <g transform="translate(360, 1150)">
    <path d="M55,10 Q120,10 180,-15" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,4"/>
    <polygon points="177,-11 185,-17 178,-20" fill="#22c55e" opacity="0.5"/>
  </g>

  <!-- Step 5: ¡Usar! -->
  <g transform="translate(720, 1150)">
    <circle cx="0" cy="0" r="50" fill="#1a1a1a" stroke="#22c55e" stroke-width="2.5"/>
    <!-- Rocket icon -->
    <path d="M0,-24 C-8,-14 -10,0 -8,14 L8,14 C10,0 8,-14 0,-24Z" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="4" fill="#22c55e"/>
    <path d="M-8,14 L-14,22 L-5,18Z" fill="#22c55e" opacity="0.7"/>
    <path d="M8,14 L14,22 L5,18Z" fill="#22c55e" opacity="0.7"/>
    <!-- Flame -->
    <path d="M-4,14 Q0,24 4,14" fill="#e31b23" opacity="0.6"/>
    <text x="0" y="75" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="middle">¡Lanzar!</text>
  </g>

  <!-- Step numbers (small, subtle) -->
  <g font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
    <circle cx="500" cy="785" r="11" fill="#e31b23"/>
    <text x="500" y="789" text-anchor="middle">1</text>
    <circle cx="680" cy="895" r="11" fill="#e31b23"/>
    <text x="680" y="899" text-anchor="middle">2</text>
    <circle cx="500" cy="1005" r="11" fill="#e31b23"/>
    <text x="500" y="1009" text-anchor="middle">3</text>
    <circle cx="320" cy="1115" r="11" fill="#e31b23"/>
    <text x="320" y="1119" text-anchor="middle">4</text>
    <circle cx="680" cy="1115" r="11" fill="#22c55e"/>
    <text x="680" y="1119" text-anchor="middle">5</text>
  </g>

  <!-- ===== BOTTOM CTA ===== -->
  <rect x="240" y="1268" width="600" height="52" rx="26" fill="url(#redG)"/>
  <text x="540" y="1300" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    Descubre nuestro enfoque → extremedev.cl
  </text>

  <!-- Logo -->
  <text x="540" y="1255" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Extreme<tspan fill="#e31b23">Dev</tspan>
  </text>
</svg>