name: Infrastructure + Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "20"
  TF_VAR_acm_certificate_arn: "arn:aws:acm:us-east-1:190493316196:certificate/d1b26770-9619-4787-91fb-a29bb89272a1"

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Terraform — Levanta la infraestructura
  # ─────────────────────────────────────────────
  infra:
    name: Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      s3_bucket: ${{ steps.tf_output.outputs.s3_bucket }}
      cloudfront_id: ${{ steps.tf_output.outputs.cloudfront_id }}
      role_arn: ${{ steps.tf_output.outputs.role_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create state bucket (if not exists)
        run: |
          aws s3api head-bucket --bucket extremedev-terraform-state --region $AWS_REGION 2>/dev/null || \
          aws s3api create-bucket --bucket extremedev-terraform-state --region $AWS_REGION

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Export Terraform Outputs
        id: tf_output
        working-directory: infra
        run: |
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "role_arn=$(terraform output -raw github_actions_role_arn)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # Job 2: Build + Deploy al S3 + Invalidar CDN
  # ─────────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          npm run build.server
        env:
          NODE_ENV: production

      - name: Sync to S3
        run: |
          S3_BUCKET="${{ needs.infra.outputs.s3_bucket }}"

          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "q-manifest.json"

          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "public, max-age=0, must-revalidate"

          aws s3 cp dist/q-manifest.json "s3://${S3_BUCKET}/q-manifest.json" \
            --cache-control "public, max-age=0, must-revalidate" \
            2>/dev/null || true

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ needs.infra.outputs.cloudfront_id }}" \
            --paths "/*"
